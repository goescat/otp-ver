
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
    }

    .container {
      width: min(90%, 420px);
      padding: 40px 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #eef2ff;
      font-size: 28px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    .description {
      color: #777;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .otp-wrapper {
      position: relative;
      margin-bottom: 24px;
      cursor: text;
    }

    .otp-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 2;
      cursor: text;
      font-size: 16px;
    }

    .otp-boxes {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .otp-box {
      width: 48px;
      height: 58px;
      border: 1.5px solid #dedfe5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      transition: all 0.2s ease;
      background: white;
    }

    .otp-box.active {
      border-color: #635bff;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.12);
    }

    .otp-box.filled {
      border-color: #635bff;
    }

    .message {
      min-height: 22px;
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }

    .message.error {
      color: #e5484d;
    }

    .message.success {
      color: #16a36a;
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: #635bff;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .resend {
      margin-top: 24px;
      font-size: 13px;
      color: #888;
    }

    .resend a {
      color: #635bff;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .otp-boxes {
        gap: 6px;
      }

      .otp-box {
        width: 42px;
        height: 54px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="icon">✉️</div>

    <h1>Verification Code</h1>

    <p class="description">
      We've sent a 6-digit verification code to your phone.<br />
      Please enter the code below.
    </p>

    <div class="otp-wrapper" id="otpWrapper">

      <!-- Single input for native OTP autofill -->
      <input
        id="otpInput"
        class="otp-input"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="[0-9]*"
        maxlength="6"
        aria-label="Six digit verification code"
      />

      <!-- Visual separated boxes -->
      <div class="otp-boxes" id="otpBoxes">
        <div class="otp-box"></div>
        <div class="otp-box"></div>
        <div class="otp-box"></div>
        <div class="otp-box"></div>
        <div class="otp-box"></div>
        <div class="otp-box"></div>
      </div>

    </div>

    <div class="message" id="message">
      Enter your 6-digit code
    </div>

    <button id="verifyBtn" disabled>
      Verify
    </button>

    <div class="resend">
      Didn't receive the code?
      <a id="resendBtn">Resend code</a>
    </div>

  </main>

  <script>
    const input = document.getElementById("otpInput");
    const boxes = document.querySelectorAll(".otp-box");
    const verifyBtn = document.getElementById("verifyBtn");
    const message = document.getElementById("message");
    const wrapper = document.getElementById("otpWrapper");

    function renderOTP() {
      const value = input.value;

      boxes.forEach((box, index) => {
        box.textContent = value[index] || "";
        box.classList.toggle("filled", !!value[index]);
        box.classList.toggle(
          "active",
          index === value.length && value.length < 6
        );
      });

      verifyBtn.disabled = value.length !== 6;

      message.className = "message";

      if (value.length === 6) {
        message.textContent = "Code entered. Ready to verify.";
      } else {
        message.textContent = "Enter your 6-digit code";
      }
    }

    input.addEventListener("input", () => {
      // Keep digits only
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      renderOTP();

      if (input.value.length === 6) {
        // Optional: automatically trigger verification
        // verifyOTP();
      }
    });

    wrapper.addEventListener("click", () => {
      input.focus();
    });

    function verifyOTP() {
      const code = input.value;

      if (code.length !== 6) return;

      // Demo verification
      if (code === "123456") {
        message.textContent = "Verification successful!";
        message.className = "message success";
      } else {
        message.textContent = "Invalid verification code.";
        message.className = "message error";
      }
    }

    verifyBtn.addEventListener("click", verifyOTP);

    document.getElementById("resendBtn").addEventListener("click", () => {
      input.value = "";
      renderOTP();
      input.focus();
      message.textContent = "A new code has been requested.";
    });

    renderOTP();
  </script>
</body>
</html>
